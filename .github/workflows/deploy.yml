name: Deploy

# The demo is a real GraphPilot service, deployed twice: the production demo, and the stage
# platform's demo (README.md, "The stage demo"). Each deploy is two halves that have to both land,
# the origin (a Cloudflare Worker) and the edge's copy of this repository's schema and
# `gpilot.toml`. The steps are in deploy-demo.yml, once, so the two legs cannot drift apart.
on:
    push:
        branches: [main]
    workflow_dispatch:

# One deploy at a time. Two overlapping runs could publish the schema of one commit against the
# worker of another, which is the edge caching by rules the origin does not serve.
concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    production:
        uses: ./.github/workflows/deploy-demo.yml
        with:
            environment: production
        secrets: inherit

    # Off until the stage environment is configured: a half-configured stage leg is refused by its
    # guard and would turn every push red. Set the repository variable STAGE_DEPLOY_ENABLED to true
    # once the stage environment holds everything README.md lists.
    stage:
        if: vars.STAGE_DEPLOY_ENABLED == 'true'
        uses: ./.github/workflows/deploy-demo.yml
        with:
            environment: stage
            wrangler-env: stage
        secrets: inherit
